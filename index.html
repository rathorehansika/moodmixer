<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoodMixer V2 🎨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="particleCanvas"></canvas>

  <div class="container">
    <h1>MoodMixer V2</h1>
    <p>Select your mood:</p>
    <div class="mood-buttons">
      <button data-mood="happy">😊 Happy</button>
      <button data-mood="chill">😎 Chill</button>
      <button data-mood="energetic">⚡ Energetic</button>
      <button data-mood="sad">😢 Sad</button>
      <button data-mood="creative">🎨 Creative</button>
    </div>

    <div class="mood-board" id="moodBoard">
      <!-- Tiles appear dynamically -->
    </div>

    <button id="downloadBtn">Download Mood Board</button>
  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
